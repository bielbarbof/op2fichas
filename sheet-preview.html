<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Ficha OP2</title>
  <link rel="stylesheet" href="./sheet.css" />
</head>
<body>
  <main id="sheet" class="sheet-shell">
    <header class="sheet-header">
      <div class="header-title">
        <span class="micro">ORDEM PARANORMAL RPG 2 // PLAYTEST ALPHA</span>
        <div class="name-row"><h1 id="name">...</h1><span id="profile" class="profile-tag">...</span><span class="dot">•</span><span id="occupation" class="occupation">...</span><span class="dot">•</span><span>NÍVEL <b id="level">2</b></span></div>
      </div>
      <div class="header-tools"><span id="controller" class="controller">...</span><button id="close" class="close-btn" aria-label="Fechar">×</button></div>
    </header>

    <section id="unauthorized" class="unauthorized hidden">Esta ficha não está atribuída a você.</section>

    <section id="sheetBody" class="sheet-grid hidden">
      <aside class="left-column">
        <section class="block attributes-block">
          <div class="ribbon">ATRIBUTOS</div>
          <div id="attributes" class="attributes"></div>
        </section>

        <section class="block skills-block">
          <div class="block-head">
            <div class="ribbon">PERÍCIAS</div>
            <div class="test-controls">
              <label>DT <input id="dtInput" type="number" min="1" max="99" value="7" /></label>
              <label>ATRIBUTO <select id="attributeOverride"><option value="base">BASE</option><option value="fisico">FÍSICO</option><option value="mente">MENTE</option><option value="emocao">EMOÇÃO</option></select></label>
            </div>
          </div>
          <div id="skills" class="skills"></div>
        </section>
      </aside>

      <section class="portrait-column">
        <div class="portrait-frame"><img id="portrait" alt="" /></div>
        <div id="pending" class="pending-panel"></div>
      </section>

      <aside class="right-column">
        <section class="resources">
          <article class="resource-card pv-card">
            <div class="resource-head"><span>PV</span><strong><b id="pvValue">0</b>/<span id="pvMax">0</span></strong></div>
            <div id="pvPips" class="pips"></div>
            <div class="resource-actions"><button data-res="pv" data-delta="-1">−1</button><button data-res="pv" data-delta="1">+1</button></div>
          </article>
          <article class="resource-card pd-card">
            <div class="resource-head"><span>PD</span><strong><b id="pdValue">0</b>/<span id="pdMax">0</span></strong></div>
            <div id="pdPips" class="pips"></div>
            <div class="resource-actions"><button data-res="pd" data-delta="-1">−1</button><button data-res="pd" data-delta="1">+1</button></div>
          </article>
        </section>

        <section id="abilities" class="abilities"></section>
      </aside>
    </section>

    <div id="rollResult" class="roll-result hidden" role="status" aria-live="polite"></div>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script type="module" src="./sheet-preview.js"></script>
</body>
</html>
