<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Ficha OP2</title>
  <link rel="stylesheet" href="./fonts.css?v=0.7.3" />
  <link rel="stylesheet" href="./sheet.css?v=0.7.3" />
  <link rel="stylesheet" href="./roll-card.css?v=0.7.3" />
</head>
<body>
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader-copy">
      <img src="./assets/ui/community-license.png" class="preloader-seal" alt="Selo da Licença da Comunidade" />
      <strong id="preloadName">...</strong>
      <div id="preloadProgress" class="preloader-progress" role="progressbar" aria-label="Carregando ficha" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    </div>
  </div>

  <main id="sheet" class="sheet-shell">
    <header class="sheet-header">
      <div class="header-title">
        <div class="name-row">
          <h1 id="name">...</h1>
          <span id="profile" class="profile-tag">...</span>
          <span class="dot">•</span>
          <span id="occupation" class="occupation">...</span>
          <span class="dot">•</span>
          <span class="level-word">NÍVEL</span>
          <b id="level" class="level-badge">2</b>
        </div>
      </div>
      <div class="header-tools">
        <div id="pending" class="pending-panel"></div>
        <button id="close" class="close-btn" aria-label="Fechar ficha"><span>FECHAR</span><b>×</b></button>
      </div>
    </header>

    <section id="unauthorized" class="unauthorized hidden">Esta ficha não está atribuída a você.</section>

    <section id="sheetBody" class="sheet-grid hidden">
      <aside class="left-column">
        <section class="block skills-block">
          <div class="block-head"><div class="ribbon ribbon-skills">PERÍCIAS</div></div>
          <div id="skills" class="skills"></div>
        </section>
      </aside>

      <section class="portrait-column" aria-label="Personagem">
        <div class="portrait-stage"></div>
      </section>

      <aside class="right-column">
        <section class="block attributes-block">
          <div class="block-head"><div class="ribbon ribbon-attributes">ATRIBUTOS</div></div>
          <div id="attributes" class="attributes"></div>
        </section>
        <div id="pendingMobile" class="pending-panel pending-panel-mobile" aria-label="Efeitos temporários"></div>
        <div class="resource-divider" aria-hidden="true"></div>
        <section class="resources">
          <article class="resource-card pv-card">
            <div class="resource-head"><span>PV</span><strong><b id="pvValue">0</b>/<span id="pvMax">0</span></strong></div>
            <div id="pvPips" class="pips"></div>
            <div class="resource-actions"><button data-res="pv" data-delta="-1" aria-label="Remover 1 PV">−</button><button data-res="pv" data-delta="1" aria-label="Adicionar 1 PV">+</button></div>
          </article>
          <article class="resource-card pd-card">
            <div class="resource-head"><span>PD</span><strong><b id="pdValue">0</b>/<span id="pdMax">0</span></strong></div>
            <div id="pdPips" class="pips"></div>
            <div class="resource-actions"><button data-res="pd" data-delta="-1" aria-label="Remover 1 PD">−</button><button data-res="pd" data-delta="1" aria-label="Adicionar 1 PD">+</button></div>
          </article>
        </section>
        <section id="abilities" class="abilities"></section>
      </aside>
    </section>

    <div id="rollResult" class="roll-result hidden" role="status" aria-live="polite"></div>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script type="module" src="./sheet.js"></script>
</body>
</html>
